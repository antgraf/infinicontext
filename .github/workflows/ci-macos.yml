name: CI (macOS)

# Stage 2B Phase 8 / D37: macOS runs are manual-only because private-repo macos-latest minutes
# bill at 10x the windows-latest rate. Trigger this workflow whenever Phase 7's macOS-specific
# code (`PosixSignalSupervisor`, `FileSystemNaming`, [MacOnlyFact] tests) is touched, or before
# any release that needs to declare the "killing the host cleans up child processes — verified
# on macOS" exit criterion green.
#
# The [MacOnlyFact] tests light up here. They split into two layers:
#   * reap-primitive tests — Dispose/DetachAll on PosixSignalSupervisor in isolation;
#   * host-lifecycle smoke (task 0023 C2/C3) — `HostLifecycle_SIGINT_*` / `HostLifecycle_SIGTERM_*`
#     spawn the real `SupervisorHostProbe` host, send real SIGINT/SIGTERM, and assert that Ctrl+C
#     leaves the host+children alive while SIGTERM terminates the host AND reaps its children.
#     This is the layer that actually validates "kill the host → host exits and children die", which
#     the reap-primitive tests cannot observe.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'InfiniContext.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      # Scope to InfiniContext.Tests, NOT the whole slnx. The slnx carries the UIA projects
      # (InfiniContext.Gui.UiaDriver / .UiaTests) which target net10.0-windows and reference
      # Microsoft.WindowsDesktop.App.WindowsForms (FlaUI) — those cannot build on macOS (NETSDK1073)
      # and are covered separately by the Windows-only ci-uia.yml. Building the test csproj
      # transitively builds Core / Cli / Gui / FakeClaude / SupervisorHostProbe, which is everything
      # the cross-platform + [MacOnlyFact] supervisor suite needs. (Earlier full-slnx runs passed
      # only because the slnx predated the UIA projects.)
      - name: Restore
        run: dotnet restore tests/InfiniContext.Tests/InfiniContext.Tests.csproj

      # No `dotnet format --verify-no-changes` here — the Windows CI owns the formatting gate so we
      # don't burn 10x-billed macOS minutes on a cosmetic check.

      - name: Build
        run: dotnet build tests/InfiniContext.Tests/InfiniContext.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/InfiniContext.Tests/InfiniContext.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory coverage
